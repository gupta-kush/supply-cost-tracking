<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen preview</title>
<link rel="stylesheet" href="../vendor/main.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  /* Preview chrome only. Nothing here ships: the file is deleted in phase 4. */
  .preview-bar {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    padding: .6rem 1.25rem; border-bottom: 1px solid var(--app-rule);
    background-color: var(--bs-body-bg); font-size: .8rem;
  }
  .preview-bar strong { font-weight: 600; margin-right: .5rem; }
</style>
</head>
<body>

<div class="preview-bar">
  <strong>Screen preview</strong>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="screen-results">Results</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="screen-price">Price</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="theme">Theme</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="prices-none">No prices</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="prices-some">Some prices</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="prices-all">All prices</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="panel-empty">Empty panel</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="first-year">First year</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-do="reset">Reset</button>
  <span class="ms-auto" id="preview-width"></span>
</div>

<main id="app"></main>

<script type="module">
import { mountResults } from "../js/screens/results.js";
import { mountPrice } from "../js/screens/price.js";
import { pricesToCsv } from "../js/pipeline.js";

/* ── format.js and the money line ───────────────────────────────────
   The real module, not a stub. It was stubbed here only while task A3 was in
   flight; importing it means the preview and the headless test exercise the same
   formatting and the same money line the page will ship with, so neither can
   quietly drift from the other.                                                   */

import * as fmt from "../js/format.js";

const moneyLine = () => fmt.moneyLine(state.ranked, state.priceRows, state.top);

/* ── state and a small simulator ────────────────────────────────────────────── */

const fixture = await (await fetch("fixtures/results-sample.json")).json();
let state = null;
const listeners = [];

function load() {
  listeners.length = 0;
  const copy = JSON.parse(JSON.stringify(fixture));
  state = {
    year: copy.year,
    top: copy.top,
    counts: copy.counts,
    ranked: copy.ranked,
    masterRows: copy.masterRows,
    master: new Map(copy.masterRows.map((r) => [r.key, r])),
    open: copy.open,
    conflicts: copy.conflicts,
    duplicates: copy.duplicates,
    notes: copy.notes,
    priceRows: copy.priceRows,
    carriedPrices: copy.carriedPrices,
    findings: [],
    modelAvailable: false,
  };
}

const subscribe = (fn) => listeners.push(fn);
const notify = () => listeners.forEach((fn) => fn());

function reRank() {
  state.ranked.sort((a, b) => Number(b.eaches) - Number(a.eaches));
  state.ranked.forEach((row, i) => { row.rank = String(i + 1); });
  state.counts.office = state.ranked.length;
  state.counts.undecided = state.open.length;
}

/** Enough of app.answer to see the screen move. The real one calls applyQueue. */
function answer(key, fields) {
  const openRow = state.open.find((r) => r.key === key);
  if (openRow) {
    Object.assign(openRow, fields);
    if (String(openRow.include) === "n") {
      state.open = state.open.filter((r) => r !== openRow);
    } else if (String(openRow.include) === "y" && String(openRow.units_per_pack || "").trim()) {
      state.open = state.open.filter((r) => r !== openRow);
      state.masterRows.push({
        key: openRow.key, raw_title: openRow.raw_title,
        canonical_name: openRow.canonical_name,
        units_per_pack: openRow.units_per_pack, upp_source: "master", display_name: "",
      });
      state.master.set(openRow.key, state.masterRows[state.masterRows.length - 1]);
      state.ranked.push({
        rank: "0", canonical_name: openRow.canonical_name, eaches: openRow.eaches,
        packs: "1", units_per_pack: openRow.units_per_pack, unit_label: "EA",
        keys: openRow.key, sources: "amazon", last_paid_per_each: "", upp_source: "master",
      });
      reRank();
    }
    notify();
    return;
  }

  const master = state.master.get(key) || state.masterRows.find((r) => r.key === key);
  if (master) {
    Object.assign(master, fields, { upp_source: "master" });
    if (fields.canonical_name) {
      const ranked = state.ranked.find((r) => String(r.keys).includes(key));
      if (ranked) ranked.canonical_name = fields.canonical_name;
      state.duplicates = [];
    }
    if (fields.units_per_pack) {
      const ranked = state.ranked.find((r) => String(r.keys).includes(key))
        || state.ranked.find((r) => r.canonical_name === master.canonical_name);
      if (ranked) {
        const factor = Number(fields.units_per_pack) / Number(ranked.units_per_pack || 1);
        ranked.units_per_pack = fields.units_per_pack;
        ranked.upp_source = "master";
        if (Number.isFinite(factor) && factor > 0) {
          ranked.eaches = String(Math.round(Number(ranked.eaches) * factor));
        }
      }
      state.conflicts = state.conflicts.filter(
        (c) => c.key !== key && c.name !== master.canonical_name
      );
      reRank();
    }
  }
  notify();
}

function confirmProposed(keys) {
  for (const key of keys) {
    const row = state.master.get(key);
    if (row) row.upp_source = "master";
    const ranked = state.ranked.find((r) => String(r.keys).includes(key));
    if (ranked) ranked.upp_source = "master";
  }
  notify();
}

/** One vendor cell, exactly the fields v1 kept in priceEdits. */
function setPrice(name, vendor, fields) {
  let row = state.priceRows.find((r) => r.canonical_name === name && r.vendor === vendor);
  if (!row) {
    const ranked = state.ranked.find((r) => r.canonical_name === name);
    row = {
      rank: ranked ? ranked.rank : "", canonical_name: name, vendor,
      unit_price: "", status: "unpriced", url: "", checked_on: "", note: "",
    };
    state.priceRows.push(row);
  }
  Object.assign(row, fields);
  row.checked_on = fields.status && fields.status !== "unpriced" ? "2026-09-17" : "";
  notify();
}

function go(screen, focus) {
  if (focus) state.priceFocus = focus;
  showScreen(screen);
  notify();
}

function showScreen(screen) {
  for (const section of document.querySelectorAll("[data-screen]")) {
    section.hidden = section.dataset.screen !== screen;
  }
}

/* ── boot: use the real markup out of index.html so the preview cannot drift ── */

const shell = await (await fetch("../index.html")).text();
const parsed = new DOMParser().parseFromString(shell, "text/html");
const live = document.importNode(parsed.querySelector("#status-live"), true);
document.body.insertBefore(live, document.querySelector("#app"));
for (const id of ["#screen-results", "#screen-price"]) {
  document.querySelector("#app").appendChild(document.importNode(parsed.querySelector(id), true));
}

load();
mountAll();
showScreen("results");

function mountAll() {
  const shared = { state, subscribe, go, answer, confirmProposed, setPrice, moneyLine, fmt };
  mountResults(shared);
  mountPrice(shared);
}

/* ── preview controls ───────────────────────────────────────────────────────── */

const clearPrices = () => {
  for (const row of state.priceRows) {
    row.unit_price = ""; row.status = "unpriced"; row.checked_on = "";
  }
};

document.querySelector(".preview-bar").addEventListener("click", (event) => {
  const what = event.target.closest("[data-do]");
  if (!what) return;
  const action = what.dataset.do;
  if (action === "theme") {
    const next = document.documentElement.dataset.bsTheme === "dark" ? "light" : "dark";
    document.documentElement.dataset.bsTheme = next;
    return;
  }
  if (action === "prices-none") { clearPrices(); notify(); return; }
  if (action === "prices-some") { rebind(); return; }
  if (action === "prices-all") {
    for (const row of state.priceRows) {
      if (row.status === "unpriced") { row.unit_price = "1.00"; row.status = "priced"; }
    }
    notify();
    return;
  }
  if (action === "screen-results" || action === "screen-price") {
    showScreen(action.slice("screen-".length));
    notify();
    return;
  }
  // Exports alone, no carried master, no model key: the shape the reviewer measured
  // at 286 undecided, so the framing and the paging can be looked at.
  if (action === "first-year") {
    const seed = state.open[0];
    const many = [];
    for (let i = 0; i < 286; i += 1) {
      many.push({
        ...seed,
        key: `amz:first year sample product ${i}`,
        raw_title: `Sample Product ${i}, Assorted, 12 Count`,
        canonical_name: `Sample Product ${i}, Assorted, 12 Count`,
        include: "",
        eaches: String(300 - i),
        would_rank: "",
      });
    }
    state.open = many;
    state.counts.lines = 1238;
    state.counts.office = 95;
    state.counts.undecided = many.length;
    state.modelAvailable = false;
    notify();
    return;
  }
  if (action === "panel-empty") {
    state.open = [];
    state.conflicts = [];
    state.duplicates = [];
    state.notes = [];
    notify();
    return;
  }
  if (action === "reset") { rebind(); }
});

/* Reload the fixture and point the already-mounted screen at the new object. */
function rebind() {
  load();
  mountAll();
}

/* The headless test reads the real prices.csv text the page would download, built
   by pipeline.js from whatever the price screen has written. */
window.__previewPricesCsv = () => pricesToCsv(state.priceRows);
window.__previewReady = true;

const showWidth = () => {
  document.querySelector("#preview-width").textContent =
    `${window.innerWidth} x ${window.innerHeight}`;
};
window.addEventListener("resize", showWidth);
showWidth();
</script>
</body>
</html>
