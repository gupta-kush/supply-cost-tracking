[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplytrack"
version = "0.1.0"
description = "Annual office-supply spend comparison: ingest the Amazon Business and Preferred order exports, keep every judgement call in a reviewed item master, rank items by units bought, and build the leadership workbook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
supplytrack = "supplytrack.cli:main"

[tool.setuptools]
packages = ["supplytrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
